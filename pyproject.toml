[project]
name = "kurojisho"
version = "0.1.0"
description = "Local, deterministic security knowledge graph for a codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "networkx>=3.3",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.22",
    "defusedxml>=0.7",
]

[project.scripts]
kurojisho = "kurojisho.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kurojisho"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "hypothesis>=6",
    "syrupy>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx",
    "types-jsonschema",
    "types-defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture repos are scan targets: never import or collect anything inside them.
norecursedirs = [".*", "fixtures", "build", "dist", "node_modules"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (excluded with -m 'not slow')",
    "needs_tools: requires external scanner tools (M2+)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.coverage.run]
source = ["kurojisho"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
