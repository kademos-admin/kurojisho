apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: vuln-api}
  template:
    metadata:
      labels: {app: vuln-api}
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: vuln-api:latest
          securityContext:
            privileged: true
            runAsUser: 0
